<nav class="menu-container" aria-label="Secciones principales">
  <div class="menu-sections" role="tablist">
    @for (section of sections; track section.label) {
      <button
        class="menu-section"
        [class.menu-section-selected]="selectedSection() === section.label"
        type="button"
        role="tab"
        [attr.aria-selected]="selectedSection() === section.label"
        [attr.aria-label]="section.label"
        [attr.title]="section.label"
        [class.menu-section-tooltip-visible]="tooltipSection() === section.label"
        (click)="selectSection(section.label)"
        (pointerdown)="startTooltip(section.label)"
        (pointerup)="stopTooltip()"
        (pointerleave)="stopTooltip()"
        (pointercancel)="stopTooltip()">
        <fa-icon [icon]="section.icon" class="menu-section-icon"></fa-icon>
        <span class="menu-tooltip">{{ section.label }}</span>
      </button>
    }
  </div>
</nav>
