<section class="hoja5-panel" aria-label="Hoja 5">
  <div class="hoja5-toolbar">
    <label class="hoja5-select-wrap">
      <span class="visually-hidden">Seleccionar lista</span>
      <select [value]="selectedOption()" (change)="selectOption($event)">
        @for (option of options; track option) {
          <option [value]="option">{{ option }}</option>
        }
      </select>
      <fa-icon [icon]="faChevronDown" class="hoja5-chevron" aria-hidden="true"></fa-icon>
    </label>
    <button
      class="hoja5-edit-button"
      type="button"
      [attr.aria-label]="isEditing() ? 'Terminar edición' : 'Editar tabla'"
      [attr.title]="isEditing() ? 'Terminar edición' : 'Editar tabla'"
      (click)="toggleEditing()">
      <fa-icon [icon]="isEditing() ? faCheck : faPen"></fa-icon>
    </button>
  </div>

  <div class="hoja5-table-wrap" [class.hoja5-editing]="isEditing()">
    <table>
      <thead>
        <tr>
          @for (header of headers[selectedOption()]; track $index) {
            <th>
              @if (isEditing()) {
                <input [value]="header" (input)="updateHeader($event, $index)" />
              } @else {
                {{ header }}
              }
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows()[selectedOption()]; track $index; let rowIndex = $index) {
          <tr>
            @for (cell of row; track $index) {
              <td>
                @if (isEditing()) {
                  <input [value]="cell" (input)="updateCell($event, rowIndex, $index)" />
                } @else {
                  <button class="hoja5-cell-button" type="button" (click)="openTextPlus(rowIndex, $index)">
                    {{ cell || ' ' }}
                  </button>
                }
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>

@if (textPlusCell()) {
  <app-text-plus
    [(textoContenido)]="textPlusValue"
    (aceptar)="saveTextPlus()"
    (cerrar)="closeTextPlus()"></app-text-plus>
}
